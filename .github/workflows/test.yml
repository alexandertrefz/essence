# NOTE: The gate runs the root scripts a contributor runs, cheapest first, so
# the quickest failure to read is the first one reported.
name: Test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # NOTE: `.bun-version` holds the Bun this repository is developed against,
      # so CI runs the one a contributor does rather than whatever the runner
      # ships this week. Bun is not merely the task runner here: the packages
      # are TypeScript executed straight through it with no build step, the
      # specs are written against `bun:test` down to its snapshot format, and
      # several of them import an emitted Program as a module. A version drift
      # would surface as a failure nobody could reproduce locally. It is the
      # version `@types/bun` is pinned to as well — the types the checkout is
      # checked against are that Bun's, so the two move together.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # NOTE: `bun.lock` decides the dependency versions, and `--frozen-lockfile`
      # is what makes that binding rather than advisory — an install that would
      # have to change the lockfile fails here instead of quietly resolving
      # something newer than what the versions were pinned to.
      - run: bun install --frozen-lockfile

      # NOTE: `.es` sources are held to `esfmt` by the formatter's own spec, so
      # `bun run test` is their format check.
      - run: bun run format:check

      - run: bun run lint

      - run: bun run typecheck

      # NOTE: Through the script rather than as `bun test` spelled out, so that
      # what CI runs is what a contributor runs — the script is where the
      # flags live, and a flag added there is added here without anybody
      # remembering to. What it carries today is `--parallel`: a worker per
      # core, each file in a global of its own, which is a third of the wall
      # time on this runner and no change to what passes — a file that only
      # passed because of what an earlier one left behind would have been a
      # bug here, not a feature.
      - run: bun run test

  # NOTE: The Netlify deploy's own build and link check, so a broken link fails
  # the pull request rather than the deploy after it.
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - run: bun run --cwd packages/website build

      - run: bun run --cwd packages/website check:links

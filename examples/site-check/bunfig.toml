# Registers the Essence plugin before anything runs, so that `check.ts` can
# `import … from "./survey/Survey.es"`.
preload = ["./essence.ts"]

[test]
# Bun reads only the bunfig.toml of the directory a run starts in, so a run
# started here preloads the repository's test budget itself. See "The test
# budget" in scripts/DEVELOPMENT.md.
preload = ["../../scripts/testBudget.ts"]

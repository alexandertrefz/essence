# The website is built by Bun from the workspace root — `packages/website`
# resolves its dependencies through the root `node_modules`, so the install has
# to happen here rather than in the package.

[build]
command = "bun install --frozen-lockfile && bun run --cwd packages/website build"
publish = "packages/website/dist"

[build.environment]
# NOTE: Keep in lockstep with `.bun-version`.
BUN_VERSION = "1.3.14"

# The diagnostics page used to be served at `/diagnostics` by GitHub Pages.
# Every terminal report and Language Server client that ever printed that URL
# still points here.
[[redirects]]
from = "/diagnostics"
to = "/docs/reference/diagnostics"
status = 301
force = true

# The optimisation passes, at the short address beside it. `essence help build`
# sends a reader to the page a pass is documented under, and a name typed from
# a terminal is typed short.
[[redirects]]
from = "/optimisations"
to = "/docs/reference/optimisations"
status = 301
force = true

# Project layout left Getting Started and became the Projects guide. The old
# address was live, so it keeps working.
[[redirects]]
from = "/docs/getting-started/project-layout"
to = "/docs/guides/projects"
status = 301
force = true

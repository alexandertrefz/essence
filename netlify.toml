# The website is built by Bun from the workspace root — `packages/website`
# resolves its dependencies through the root `node_modules`, so the install has
# to happen here rather than in the package.

[build]
command = "bun install --frozen-lockfile && bun run --cwd packages/website build"
publish = "packages/website/dist"

[build.environment]
# NOTE: Keep in lockstep with `.bun-version`.
BUN_VERSION = "1.3.14"

# The diagnostics page used to be served at `/diagnostics` by GitHub Pages.
# Every terminal report and Language Server client that ever printed that URL
# still points here.
[[redirects]]
from = "/diagnostics"
to = "/docs/reference/diagnostics"
status = 301
force = true
